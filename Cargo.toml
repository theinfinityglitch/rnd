[workspace]
members = ["rndctl"]

[workspace.dependencies]
rnd = { path = "." }
gtk4 = { version = "0.11", features = ["v4_8"] }
async-channel = "2"
gtk4-layer-shell = { version = "0.8", features = ["v1_3"] }
zbus = { version = "4", default-features = false, features = [
    "tokio",
    "option-as-array",
] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.11", features = ["blocking", "rustls-tls"] }
libc = "0.2"
sd-notify = "0.5.0"
clap = { version = "4", features = ["derive"] }

[package]
name = "rnd"
version = "0.2.0"
edition = "2021"
description = "A GTK4-based Wayland notification daemon"
license = "MIT"

[[bin]]
name = "rnd"
path = "src/main.rs"

[dependencies]
gtk4.workspace = true
async-channel.workspace = true
gtk4-layer-shell.workspace = true
zbus.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
dirs.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
reqwest.workspace = true
libc.workspace = true
sd-notify.workspace = true
